name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by `publish.yml`: what gets published goes through the same gates.
  workflow_call:

# Without this, a new push leaves the previous one running and competing for runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One broken version must not hide the state of the others.
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: pytest
        # --cov-fail-under comes from pyproject: falling coverage goes red.
        run: pytest --cov=litellm_mysubs --cov-report=term-missing

  # The plugin runs inside someone else's image and touches LiteLLM internals.
  # This job is what turns a silently incompatible upgrade into a red CI run,
  # instead of a production outage.
  litellm-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The pinned version is the one the reference installation runs; "latest" catches
        # incompatibilities before they reach it.
        litellm: ["1.101.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install litellm ${{ matrix.litellm }}
        # The proxy extras are required: route_llm_request imports fastapi, and that is
        # where the /v1/responses route is intercepted.
        run: |
          pip install -e ".[dev]"
          if [ "${{ matrix.litellm }}" = "latest" ]; then
            pip install --upgrade "litellm[proxy]"
          else
            pip install "litellm[proxy]==${{ matrix.litellm }}"
          fi
      - name: symbols the patch depends on
        # No --no-cov: this job runs a subset and the coverage gate belongs to the test job.
        run: pytest tests/test_litellm_contract.py -v --no-cov

  # The wiring comes from OMP. A rename on their side leaves the `# omp:` anchors pointing
  # at nothing, and the `# omp=` ones catch the worse case: the name stays and the **value**
  # changes - an endpoint path, a client id, a pinned client version. Nothing breaks at
  # import time then; it breaks in production, against upstream, with CI green.
  omp-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_omp_drift.py

  build:
    # A hand-built artifact hides a dead pipeline. What gets published is what CI built.
    needs: [test, litellm-contract, omp-anchors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
