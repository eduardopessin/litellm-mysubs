name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by `publish.yml`: what gets published goes through the same gates.
  workflow_call:

# Without this, a new push leaves the previous one running and competing for runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# LiteLLM fetches its price map from GitHub at import and silently falls back to the copy in
# the wheel when that fails. The two differ (the remote one carries extra rules), so a test
# of `completion_cost` could pass or fail depending on the network. The bundled map is the
# one pinned by the version under test; every run reads that one.
env:
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  # The plugin runs inside someone else's image and touches LiteLLM internals, so the whole
  # suite — the contract test on the internal symbols included — runs against the version
  # the reference installation runs and against the current release. The contract test
  # alone against 1.101.0 left every other behaviour measured only on `latest`.
  test:
    runs-on: ubuntu-latest
    strategy:
      # One broken version must not hide the state of the others.
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        # The pinned version is the one the reference installation runs; "latest" catches
        # incompatibilities before they reach it.
        litellm: ["1.101.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install (litellm ${{ matrix.litellm }})
        # One resolution, by uv. `pip install -e ".[dev]"` left litellm free (`>=1.70`),
        # and twice on 2026-09-28 pip's backtracking through older litellm releases ended in
        # ResolutionImpossible. uv is the installer of the local gate; it resolves in seconds
        # and names the conflicting requirement when there is one.
        # A version is pinned exactly. "latest" is left to the resolver rather than pinned to
        # PyPI's JSON `info.version`: the same day the simple index uv reads lagged the JSON
        # API by over an hour for a new release, and an exact pin would have failed CI for a
        # version the index did not serve yet. The installed version is printed, and a
        # warning is raised when it is behind the JSON API's latest, so a silent downgrade is
        # still visible.
        # The proxy extras are required: route_llm_request imports fastapi, and that is
        # where the /v1/responses route is intercepted.
        run: |
          set -euo pipefail
          python -m pip install uv
          if [ "${{ matrix.litellm }}" = "latest" ]; then
            uv pip install --system -e ".[dev]" "litellm[proxy]"
          else
            uv pip install --system -e ".[dev]" "litellm[proxy]==${{ matrix.litellm }}"
          fi
          installed=$(python -c 'from importlib.metadata import version; print(version("litellm"))')
          echo "litellm $installed"
          if [ "${{ matrix.litellm }}" = "latest" ]; then
            newest=$(curl -fsSL --retry 3 https://pypi.org/pypi/litellm/json \
              | python -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])') || newest=""
            if [ -n "$newest" ] && [ "$newest" != "$installed" ]; then
              echo "::warning::latest cell installed litellm $installed; PyPI's JSON API says $newest"
            fi
          fi
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: pytest
        # --cov-fail-under comes from pyproject: falling coverage goes red.
        run: pytest --cov=litellm_mysubs --cov-report=term-missing

  # The wiring comes from OMP. A rename on their side leaves the `# omp:` anchors pointing
  # at nothing, and the `# omp=` ones catch the worse case: the name stays and the **value**
  # changes - an endpoint path, a client id, a pinned client version. Nothing breaks at
  # import time then; it breaks in production, against upstream, with CI green.
  # Names and values still left the logic unwatched: `applyHeadCaching` and
  # `fetchClaudeUsage` were rewritten between 18.3.2 and 18.4.1 under the same names. Each
  # anchored declaration is hashed and compared with the committed `tools/omp_anchors.lock`;
  # a changed body, an unextractable one, or a lock written for another version fails here.
  omp-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: anchors, values and bodies against tools/omp_anchors.lock
        run: python tools/check_omp_drift.py --lock tools/omp_anchors.lock

  build:
    # A hand-built artifact hides a dead pipeline. What gets published is what CI built.
    needs: [test, omp-anchors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
