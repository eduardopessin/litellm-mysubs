name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Sem isto, um push novo deixa o anterior a correr e a competir por runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Uma versão partida não deve esconder o estado das outras.
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: pytest
        # --cov-fail-under vem do pyproject: cobertura a cair fica vermelha.
        run: pytest --cov=litellm_mysubs --cov-report=term-missing

  # O plugin corre dentro da imagem de outra pessoa e toca em internals do LiteLLM.
  # Este job é o que transforma um upgrade silenciosamente incompatível em CI vermelho,
  # em vez de numa avaria em produção.
  litellm-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A versao fixada e a que a instalacao de referencia corre; "latest" apanha
        # incompatibilidades antes de elas chegarem la.
        litellm: ["1.101.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: instalar litellm ${{ matrix.litellm }}
        # Os extras do proxy são precisos: route_llm_request importa fastapi, e é aí que
        # a rota /v1/responses é apanhada.
        run: |
          pip install -e ".[dev]"
          if [ "${{ matrix.litellm }}" = "latest" ]; then
            pip install --upgrade "litellm[proxy]"
          else
            pip install "litellm[proxy]==${{ matrix.litellm }}"
          fi
      - name: símbolos de que o patch depende
        # Sem --no-cov: este job corre um subconjunto e o gate de cobertura é do job test.
        run: pytest tests/test_litellm_contract.py -v --no-cov

  # O wiring é do OMP. Um rename do lado deles deixa as âncoras `# omp:` a apontar para
  # nada, e ninguém dá por isso até alguém tentar seguir uma.
  omp-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_omp_drift.py

  build:
    # Um artefacto construído à mão esconde um pipeline morto. O que se publica é o do CI.
    needs: [test, litellm-contract, omp-anchors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
