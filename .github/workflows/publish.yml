name: publish

on:
  push:
    tags: ["v*"]

jobs:
  # The same gates as every other push. A tag is not a reason to publish something
  # that was never tested: ruff, mypy, pytest, the LiteLLM contract job and the
  # anchor check all have to pass before anything leaves the runner.
  ci:
    uses: ./.github/workflows/ci.yml

  pypi:
    needs: [ci]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/litellm-mysubs
    permissions:
      # Trusted publishing: the runner mints a short-lived OIDC token for PyPI.
      # No long-lived API token lives in the repository secrets.
      id-token: write
    steps:
      # The artifact built by the `build` job of the reusable workflow. Rebuilding
      # here would publish something the gates never saw.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The GitHub release used to be created by hand, and 0.1.4, 0.1.11 and 0.1.12 ended up
  # tagged and on PyPI with no release. After PyPI, so a release never announces a version
  # that failed to publish.
  github-release:
    needs: [pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release from the tag and the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"; exit 0
          fi
          # The checkout leaves the tag lightweight; fetch it again for its annotation.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          title=$(git tag -l --format='%(contents:subject)' "$TAG")
          [ -n "$title" ] && [ "$title" != "$TAG" ] || title="${TAG#v}"
          # The version's section of CHANGELOG.md, up to the next heading. A tag with no
          # section fails here instead of publishing an empty release.
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "no CHANGELOG section for $TAG"; exit 1; }
          gh release create "$TAG" --verify-tag --title "$title" --notes-file notes.md
