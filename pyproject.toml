[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litellm-mysubs"
version = "0.1.1"
description = "Serve Claude Max, ChatGPT Plus/Codex and Google Antigravity subscriptions as OpenAI-compatible models through a LiteLLM proxy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
  "litellm",
  "oauth",
  "claude",
  "codex",
  "gemini",
  "antigravity",
  "subscription",
  "proxy",
  "llm",
  "openai-compatible",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.scripts]
mysubs-setup = "litellm_mysubs.setup_cli:main"
mysubs-login = "litellm_mysubs.login_cli:main"

[project.optional-dependencies]
# `litellm[proxy]` is deliberately absent from the runtime dependencies: this package is
# loaded *inside* a proxy that already has it, and pinning it here would fight the version
# the operator chose. The test suite does need it — it exercises the real Router and the
# real streaming path — so it lives in the dev extra, unpinned.
dev = [
  "litellm[proxy]>=1.70",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/eduardopessin/litellm-mysubs"
Source = "https://github.com/eduardopessin/litellm-mysubs"
Issues = "https://github.com/eduardopessin/litellm-mysubs/issues"
Changelog = "https://github.com/eduardopessin/litellm-mysubs/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/litellm_mysubs"]

[tool.hatch.build.targets.sdist]
# The sdist carries what makes the gate reproducible, not just the code.
include = [
  "src/litellm_mysubs",
  "tests",
  "tools",
  "docs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A test that asserts nothing passes silently. This makes it an error.
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["litellm_mysubs"]

[tool.coverage.report]
# Coverage without a gate is decoration.
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# The `numpy` that LiteLLM drags in ships stubs with 3.12 syntax (`type X = …`). Pinning
# 3.11 here made mypy abort analysis on its first file, before reaching our own code — a
# gate that fails because of a dependency says nothing about the package.
#
# 3.11 support stays declared in `requires-python`, and that is what the CI matrix measures.
python_version = "3.12"
strict = true
files = ["src/litellm_mysubs"]
# Neither LiteLLM nor numpy publish usable stubs. `jwt` is in the list because it is only
# present when the proxy is: it ships with LiteLLM and signs the UI session cookie, so it
# is never a dependency of ours and may be absent entirely.
[[tool.mypy.overrides]]
module = ["litellm.*", "numpy.*", "yaml", "jwt"]
ignore_missing_imports = true
