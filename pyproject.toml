[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litellm-mysubs"
version = "0.1.0"
description = "Ligar subscrições (Claude Max, ChatGPT Plus, Google Antigravity) ao LiteLLM como modelos"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["litellm", "oauth", "claude", "codex", "gemini", "subscription"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.scripts]
mysubs-setup = "litellm_mysubs.setup_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/eduardopessin/litellm-mysubs"
Issues = "https://github.com/eduardopessin/litellm-mysubs/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/litellm_mysubs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Um teste que não afirma nada passa em silêncio. Isto torna-o um erro.
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["litellm_mysubs"]

[tool.coverage.report]
# Cobertura sem gate é decoração; ver docs/ENGINEERING.md.
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# O `numpy` que o LiteLLM arrasta tem stubs com sintaxe de 3.12 (`type X = …`). Fixar 3.11
# aqui fazia o mypy abortar a análise no primeiro ficheiro dele, antes de chegar ao nosso
# código — um gate que falha por uma dependência não diz nada sobre o pacote.
#
# O suporte a 3.11 continua declarado em `requires-python` e é o que a matriz do CI mede.
python_version = "3.12"
strict = true
files = ["src/litellm_mysubs"]
# Nem o LiteLLM nem o numpy publicam stubs utilizáveis.
[[tool.mypy.overrides]]
module = ["litellm.*", "numpy.*", "yaml"]
ignore_missing_imports = true
